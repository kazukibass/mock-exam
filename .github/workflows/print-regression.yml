name: Print regression (Chromium)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: print-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  print-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require current base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git merge-base --is-ancestor "$BASE_SHA" HEAD
      - name: Checkout exact shared navigation assets
        uses: actions/checkout@v4
        with:
          repository: kazukibass/kazukibass.github.io
          ref: 92df862aafba31ebefae624601dcd02b5a179d9d
          path: .print-test-shell
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned print QA dependencies
        run: python -m pip install playwright==1.57.0 PyMuPDF==1.26.6
      - name: Install Chromium and Japanese fonts
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify actual PDFs and shared navigation
        run: python scripts/print-regression.py --shell-dir .print-test-shell/assets --output "$RUNNER_TEMP/mock-print"
      - name: Store synthetic PDF evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mock-exam-print-regression
          path: ${{ runner.temp }}/mock-print/
          retention-days: 7
